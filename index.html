<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สำหรับเธอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B8</text></svg>">
<style>
  :root{
    --bg-white:#fff9fb;
    --pink-light:#ffd9e6;
    --pink-mid:#ffb3cd;
    --accent:#e0447a;
    --accent-deep:#c22e63;
    --ink:#7a1f42;
    --sub-ink:#b5628a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background:var(--bg-white);
    font-family:'Inter','Noto Sans Thai',sans-serif;
  }

  #app{
    position:relative;
    width:100vw; height:100vh;
    background:linear-gradient(135deg, #ffffff 0%, var(--bg-white) 35%, var(--pink-light) 70%, var(--pink-mid) 100%);
  }

  .screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:flex-start;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
  }
  .screen.active{
    opacity:1; pointer-events:auto;
  }

  /* ---------- INTRO / FLOWER (tap 3 times to grow) ---------- */
  #screen-intro{
    justify-content:center;
    flex-direction:column;
  }
  .flower-wrap{
    width:min(58vw, 280px);
    height:min(64vw, 310px);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .flower-wrap svg{ width:100%; height:100%; overflow:visible; }
  .flower-wrap.tap-bounce{ animation:tapBounce .35s ease; }
  @keyframes tapBounce{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.12) rotate(-2deg); }
    100%{ transform:scale(1); }
  }

  .ground{ fill:#d9f0d6; }

  .stem{
    fill:none;
    stroke:#79c98a;
    stroke-width:9;
    stroke-linecap:round;
    stroke-dasharray:115;
    stroke-dashoffset:100;
    transition:stroke-dashoffset .6s ease-out;
  }
  .leaf{
    fill:#8fdb9e;
    opacity:0;
    transform:scale(0);
    transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .leaf-a{ transform-origin:90px 158px; }
  .leaf-b{ transform-origin:112px 128px; }

  .bud{
    fill:#ffcfe0;
    transform-origin:100px 88px;
    transform:scale(.4);
    opacity:1;
    transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1);
  }

  .petal{
    opacity:0;
    transform-origin:100px 88px;
    transform:scale(0);
    transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .petal.center{
    transition-delay:.15s;
  }

  /* stage 1: first tap — stem grows a little, first leaf pops */
  #screen-intro.stage-1 .stem{ stroke-dashoffset:60; }
  #screen-intro.stage-1 .leaf-a{ opacity:1; transform:scale(1); }
  #screen-intro.stage-1 .bud{ transform:scale(.7); }

  /* stage 2: second tap — stem extends, second leaf, a few petals peek out */
  #screen-intro.stage-2 .stem{ stroke-dashoffset:15; }
  #screen-intro.stage-2 .leaf-b{ opacity:1; transform:scale(1); }
  #screen-intro.stage-2 .bud{ opacity:0; transform:scale(.3); }
  #screen-intro.stage-2 .petal.p1,
  #screen-intro.stage-2 .petal.p3,
  #screen-intro.stage-2 .petal.p5{ opacity:1; transform:scale(.6); }

  /* stage 3: third tap — full bloom */
  #screen-intro.stage-3 .stem{ stroke-dashoffset:0; }
  #screen-intro.stage-3 .bud{ opacity:0; }
  #screen-intro.stage-3 .petal{ opacity:1; transform:scale(1); }

  #intro-hint{
    margin-top:1.4rem;
    text-align:center;
    font-family:'Noto Sans Thai',sans-serif;
    font-size:.9rem;
    color:var(--sub-ink);
    opacity:0;
    animation:hintFade 1s ease forwards;
    animation-delay:.6s;
  }
  #intro-hint.hide{ display:none; }
  @keyframes hintFade{ to{ opacity:.85; } }

  /* ---------- LYRICS ---------- */
  #screen-lyrics{
    padding-left:9%;
    padding-right:9%;
  }
  .lyric-line{
    max-width:640px;
  }
  #lyric-main{
    font-family:'Inter',sans-serif;
    font-weight:800;
    color:var(--accent);
    font-size:clamp(1.6rem, 4.4vw, 2.6rem);
    line-height:1.25;
    margin:0 0 .35em 0;
  }
  #lyric-sub{
    font-family:'Noto Sans Thai','Inter',sans-serif;
    font-weight:500;
    color:var(--sub-ink);
    font-size:clamp(.95rem, 2.4vw, 1.15rem);
    margin:0;
  }

  .progress-dots{
    position:absolute;
    bottom:6%; left:9%;
    display:flex; gap:6px;
  }
  .progress-dots span{
    width:6px; height:6px; border-radius:50%;
    background:var(--pink-mid);
    transition:background .3s ease, transform .3s ease;
  }
  .progress-dots span.done{ background:var(--accent); transform:scale(1.15); }

  /* ---------- OUTRO MESSAGE ---------- */
  #screen-outro{
    justify-content:center;
    text-align:center;
  }
  #screen-outro h1{
    font-family:'Noto Sans Thai',sans-serif;
    font-weight:700;
    color:var(--accent-deep);
    font-size:clamp(1.5rem, 5vw, 2.4rem);
    opacity:0;
    transform:translateY(12px);
    transition:opacity 1.1s ease, transform 1.1s ease;
    padding:0 8%;
  }
  #screen-outro.show-text h1{ opacity:1; transform:translateY(0); }

  /* ---------- FINALE / PETALS ---------- */
  #screen-finale{
    justify-content:center;
  }
  #petals{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .fall-petal{
    position:absolute;
    top:-5%;
    border-radius:60% 0 60% 0;
    opacity:.9;
    will-change:transform;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); }
    100%{ transform:translate(var(--drift), 115vh) rotate(360deg); }
  }

  #popup-card{
    position:relative;
    z-index:2;
    background:#ffffff;
    border-radius:24px;
    padding:2.6rem 3.2rem;
    box-shadow:0 20px 50px rgba(224,68,122,.25);
    text-align:center;
    opacity:0;
    transform:scale(.7);
    transition:opacity .6s cubic-bezier(.34,1.56,.64,1), transform .6s cubic-bezier(.34,1.56,.64,1);
  }
  #popup-card.show{ opacity:1; transform:scale(1); }
  #popup-card .heart{
    font-size:1.8rem;
    margin-bottom:.4rem;
  }
  #popup-card p{
    margin:0;
    font-family:'Noto Sans Thai',sans-serif;
    font-weight:800;
    color:var(--accent);
    font-size:clamp(1.8rem, 6vw, 2.8rem);
  }
  #popup-card p .good-day{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:.5em;
    font-weight:600;
    color:var(--sub-ink);
    margin-top:.25em;
  }

  /* ---------- SYNC MODE (press "S" to toggle) ---------- */
  #sync-panel{
    position:fixed;
    top:12px; right:12px;
    z-index:999;
    max-width:260px;
    max-height:80vh;
    overflow-y:auto;
    background:rgba(20,10,15,.85);
    color:#fff;
    font-family:'Inter',monospace;
    font-size:.75rem;
    line-height:1.4;
    border-radius:12px;
    padding:12px;
    display:none;
  }
  #sync-panel .sync-title{
    font-weight:700;
    margin-bottom:6px;
  }
  #sync-panel .sync-time{
    font-size:1rem;
    margin-bottom:8px;
    color:#ffd9e6;
  }
  #sync-mark-btn, #sync-copy-btn, #sync-reset-btn{
    display:block;
    width:100%;
    border:none;
    border-radius:8px;
    padding:8px;
    margin-bottom:6px;
    font-weight:700;
    cursor:pointer;
  }
  #sync-mark-btn{ background:var(--accent); color:#fff; font-size:.95rem; }
  #sync-copy-btn{ background:#ffe08a; color:#5a3d00; }
  #sync-reset-btn{ background:#e5e5e5; color:#333; }
  #sync-list{ margin:0; padding-left:18px; }


</style>
</head>
<body>

<div id="app">

  <!-- 1. INTRO: tap the flower 3 times to grow it -->
  <section id="screen-intro" class="screen active">
    <div class="flower-wrap">
      <svg viewBox="0 0 200 220">
        <ellipse class="ground" cx="100" cy="205" rx="60" ry="8" />
        <path class="stem" d="M100,203 C100,175 100,130 100,90" />
        <path class="leaf leaf-a" d="M96,162 C76,159 61,142 70,126 C89,130 98,148 96,162 Z" />
        <path class="leaf leaf-b" d="M104,132 C124,128 138,111 129,95 C111,99 102,117 104,132 Z" />
        <circle class="bud" cx="100" cy="88" r="12" />
        <g class="petal-group">
          <circle class="petal p1" cx="100" cy="58" r="25" fill="#ffcdb2" />
          <circle class="petal p2" cx="126" cy="73" r="25" fill="#ffb3b0" />
          <circle class="petal p3" cx="126" cy="103" r="25" fill="#bcdcf5" />
          <circle class="petal p4" cx="100" cy="118" r="25" fill="#b9e6c4" />
          <circle class="petal p5" cx="74" cy="103" r="25" fill="#d9c6f2" />
          <circle class="petal p6" cx="74" cy="73" r="25" fill="#ffcfe0" />
          <circle class="petal center" cx="100" cy="88" r="19" fill="#ffe08a" />
        </g>
      </svg>
    </div>
    <div id="intro-hint">ลองแตะดอกไม้ดู</div>
  </section>

  <!-- 2. LYRICS -->
  <section id="screen-lyrics" class="screen">
    <div>
      <div class="lyric-line" id="lyric-line">
        <h1 id="lyric-main"></h1>
        <p id="lyric-sub"></p>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>
  </section>

  <!-- 3. OUTRO MESSAGE -->
  <section id="screen-outro" class="screen">
    <h1>เพลงนี้เป็นของเธอนะ</h1>
  </section>

  <!-- 4. FINALE: petals + popup -->
  <section id="screen-finale" class="screen">
    <div id="petals"></div>
    <div id="popup-card">
      <div class="heart">🌸</div>
      <p>วนัช<br><span class="good-day">Good Day</span></p>
    </div>
  </section>

</div>

<audio id="bgm" src="Baby.mp3" preload="auto"></audio>

<!-- SYNC MODE overlay: press "S" to show/hide -->
<div id="sync-panel">
  <div class="sync-title">โหมดจับจังหวะ (กด S ปิด)</div>
  <div class="sync-time" id="sync-time">0:00.00</div>
  <button id="sync-mark-btn">🎯 มาร์กจังหวะ (หรือกด Space)</button>
  <button id="sync-copy-btn">📋 คัดลอกอาเรย์</button>
  <button id="sync-reset-btn">↺ เริ่มมาร์กใหม่</button>
  <ol id="sync-list"></ol>
</div>

<script>
/* =========================================================
   แก้เนื้อเพลงตรงนี้! ใส่ main = ท่อนเพลง, sub = คำแปล/ข้อความ
   จัดกลุ่มไว้เป็นท่อนที่ 1–5 (ท่อนละ 3 บรรทัด) ตามรูปที่ส่งมา
   ========================================================= */
const lyrics = [
  // ===== ท่อนที่ 1 =====
  { main: "Baby", sub: "เธอครับ" },
  { main: "tell me your favorite love song", sub: "บอกผมหน่อยสิ ว่าเพลงรักเพลงโปรดของเธอคืออะไร" },
  { main: "i wanna sing it with you", sub: "ผมอยากจะร้องเพลงนั้นไปกับเธอนะ" },
  // ===== ท่อนที่ 2 =====
  { main: "Baby", sub: "เธอครับ" },
  { main: "show me the streets", sub: "ผมอยากเห็นถนนเส้นนั้นจัง" },
  { main: "Where you come from", sub: "ถนนเส้นนั้นที่เธอเดินจากมาก" },
  // ===== ท่อนที่ 3 =====
  { main: "i wanna walk 'em with you", sub: "ผมอยากเดินไปกับเธอ" },
  { main: "Take it right from the start", sub: "ผมอยากทำตั้งแต่ต้นเลย" },
  { main: "Tell me who are you", sub: "บอกผมหน่อยว่าเธอเป็นใคร" },
  // ===== ท่อนที่ 4 =====
  { main: "Every piece of your heart", sub: "ทุกชิ้นส่วนของหัวใจคุณ" },
  { main: "Every bruise and scar", sub: "ทุกๆรอยซ้ำและแผลเป็น" },
  { main: "I wanna know", sub: "ผมอยากรู้จัง" },
  // ===== ท่อนที่ 5 =====
  { main: "Everything there is to know", sub: "อยากรู้ทุกเรื่องที่เธออยากให้รับรู้" },
  { main: "Don't you dare leave nothin' out, no", sub: "เธออย่าพึ่งอะไรไประหว่างทางเลยนะ" },
  { main: "I'm gonna love you completely", sub: "ผมจะรักเธออย่างเต็มที่เลยครับ" },
];

/* =========================================================
   จับเวลาให้ตรงกับเพลง "Baby.mp3" — เปิดเพลงฟังคู่กับนาฬิกาจับเวลา
   แล้วแก้ตัวเลข (วินาที) ของแต่ละบรรทัดด้านล่างให้ตรงกับตอนที่เนื้อร้อง
   บรรทัดนั้นเริ่มขึ้นจริงๆ — ตัวเลขต้องเรียงจากน้อยไปมากเสมอ
   ค่าที่ใส่ไว้ตอนนี้เป็นแค่ค่าเริ่มต้น (หารเวลาเท่าๆ กัน) ยังไม่ตรงจังหวะเพลงจริง
   ========================================================= */
const SONG_DURATION = 61.28;  // วินาที (ความยาวไฟล์ Baby.mp3)
const OUTRO_BUFFER = 1;      // วินาที ก่อนเพลงจบ ที่จะเริ่มเฟดไปหน้าปิดท้าย
const usableEnd = SONG_DURATION - OUTRO_BUFFER;

const LYRIC_START_TIMES = [
  // ===== ท่อนที่ 1 =====
  0.25,   // บรรทัดที่ 1  Baby
  5.87,   // บรรทัดที่ 2  tell me your favorite love song
  11.73,  // บรรทัดที่ 3  i wanna sing it with you
  // ===== ท่อนที่ 2 =====
  15.64,  // บรรทัดที่ 1  Baby
  21.39,  // บรรทัดที่ 2  show me the streets
  23.87,  // บรรทัดที่ 3  Where you come from
  // ===== ท่อนที่ 3 =====
  27.34,  // บรรทัดที่ 1  i wanna walk 'em with you
  30.80,  // บรรทัดที่ 2  Take it right from the start
  34.56,  // บรรทัดที่ 3  Tell me who are you
  // ===== ท่อนที่ 4 =====
  38.20,  // บรรทัดที่ 1  Every piece of your heart
  42.18,  // บรรทัดที่ 2  Every bruise and scar
  45.42,  // บรรทัดที่ 3  I wanna know
  // ===== ท่อนที่ 5 =====
  48.22,  // บรรทัดที่ 1  Everything there is to know
  52.03,  // บรรทัดที่ 2  Don't you dare leave nothin' out, no
  57.94,  // บรรทัดที่ 3  I'm gonna love you completely
];

const screens = {
  intro: document.getElementById('screen-intro'),
  lyrics: document.getElementById('screen-lyrics'),
  outro: document.getElementById('screen-outro'),
  finale: document.getElementById('screen-finale'),
};

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// --- progress dots ---
const dotsWrap = document.getElementById('progress-dots');
lyrics.forEach(() => {
  const d = document.createElement('span');
  dotsWrap.appendChild(d);
});
const dots = dotsWrap.querySelectorAll('span');

// --- lyric playback, driven by the actual audio clock ---
const lineEl = document.getElementById('lyric-line');
const mainEl = document.getElementById('lyric-main');
const subEl = document.getElementById('lyric-sub');
const bgm = document.getElementById('bgm');

let currentIndex = -1;
let finished = false;

function renderLine(index){
  currentIndex = index;
  lineEl.classList.remove('enter');
  mainEl.textContent = lyrics[index].main;
  subEl.textContent = lyrics[index].sub;
  dots.forEach((d,i) => d.classList.toggle('done', i <= index));

  requestAnimationFrame(() => {
    lineEl.classList.add('enter');
  });
}

function onTimeUpdate(){
  if (finished) return;
  const t = bgm.currentTime;

  if (t >= usableEnd && currentIndex >= 0){
    finished = true;
    goToOutro();
    return;
  }

  const nextIndex = LYRIC_START_TIMES.findIndex((start, i) =>
    t >= start && (i === LYRIC_START_TIMES.length - 1 || t < LYRIC_START_TIMES[i + 1])
  );
  if (nextIndex !== -1 && nextIndex !== currentIndex){
    renderLine(nextIndex);
  }
}

function fadeOutAudio(durationMs){
  const steps = 20;
  const startVol = bgm.volume;
  let i = 0;
  const iv = setInterval(() => {
    i++;
    bgm.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps){
      clearInterval(iv);
      bgm.pause();
    }
  }, durationMs / steps);
}

function goToOutro(){
  fadeOutAudio(1200);
  showScreen('outro');
  requestAnimationFrame(() => {
    setTimeout(() => screens.outro.classList.add('show-text'), 50);
  });
  setTimeout(startFinale, 3200);
}

// --- petals for finale ---
const petalColors = ['#ff8fab','#ffc2d6','#e0447a','#ffe08a','#caa0e8','#ffffff'];
function spawnPetals(count){
  const wrap = document.getElementById('petals');
  for (let i = 0; i < count; i++){
    const p = document.createElement('div');
    p.className = 'fall-petal';
    const size = 8 + Math.random() * 10;
    p.style.width = size + 'px';
    p.style.height = size * 0.8 + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    p.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    const duration = 4 + Math.random() * 4;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    wrap.appendChild(p);
  }
}

function startFinale(){
  showScreen('finale');
  spawnPetals(50);
  setTimeout(() => {
    document.getElementById('popup-card').classList.add('show');
  }, 700);
}

// --- boot sequence: tap the flower 3 times to grow it ---
// the song only starts once the flower is fully grown, right as line 1 appears
let tapCount = 0;
const introSection = screens.intro;
const flowerWrap = document.querySelector('.flower-wrap');
const introHint = document.getElementById('intro-hint');
const hintMessages = ['ลองแตะดอกไม้ดู', 'เก่งมาก แตะอีกที!', 'อีกนิดเดียว!'];

function bounceFlower(){
  flowerWrap.classList.remove('tap-bounce');
  void flowerWrap.offsetWidth; // restart the animation
  flowerWrap.classList.add('tap-bounce');
}

function currentLineForTime(t){
  let idx = 0;
  for (let i = 0; i < LYRIC_START_TIMES.length; i++){
    if (t >= LYRIC_START_TIMES[i]) idx = i;
  }
  return idx;
}

flowerWrap.addEventListener('click', () => {
  if (tapCount >= 3) return;
  tapCount++;
  introSection.classList.add('stage-' + tapCount);
  bounceFlower();

  if (tapCount < 3){
    introHint.textContent = hintMessages[tapCount];
    return;
  }

  introHint.classList.add('hide');
  setTimeout(() => {
    showScreen('lyrics');
    bgm.currentTime = 0;
    bgm.volume = 1;
    bgm.play().catch(() => { /* visuals continue even if playback is blocked */ });
    bgm.addEventListener('timeupdate', onTimeUpdate);
    bgm.addEventListener('ended', () => { if (!finished){ finished = true; goToOutro(); } });
    renderLine(currentLineForTime(bgm.currentTime));
  }, 1300);
});

// =========================================================
// SYNC MODE: กด "S" เปิด/ปิด แล้วกด Space (หรือปุ่ม "มาร์กจังหวะ")
// ทุกครั้งที่อยากให้บรรทัดถัดไปเริ่มขึ้น จะได้เวลาจริงจากเพลง
// =========================================================
let syncMode = false;
let syncMarks = [];
const syncPanel = document.getElementById('sync-panel');
const syncTimeEl = document.getElementById('sync-time');
const syncListEl = document.getElementById('sync-list');
const syncMarkBtn = document.getElementById('sync-mark-btn');
const syncCopyBtn = document.getElementById('sync-copy-btn');
const syncResetBtn = document.getElementById('sync-reset-btn');

function formatSyncTime(t){
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(2).padStart(5, '0');
  return `${m}:${s}`;
}

function renderSyncList(){
  syncListEl.innerHTML = syncMarks
    .map((t, i) => `<li>${lyrics[i] ? lyrics[i].main : ('บรรทัดที่ ' + (i + 1))} — ${t.toFixed(2)}s</li>`)
    .join('');
}

function markSyncPoint(){
  if (!syncMode) return;
  syncMarks.push(bgm.currentTime);
  renderSyncList();
}

function toggleSyncMode(){
  syncMode = !syncMode;
  syncPanel.style.display = syncMode ? 'block' : 'none';
  if (syncMode){
    syncMarks = [];
    renderSyncList();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey){
    toggleSyncMode();
    return;
  }
  if (syncMode && e.code === 'Space'){
    e.preventDefault();
    markSyncPoint();
  }
});

syncMarkBtn.addEventListener('click', markSyncPoint);

syncResetBtn.addEventListener('click', () => {
  syncMarks = [];
  renderSyncList();
});

syncCopyBtn.addEventListener('click', () => {
  const lines = syncMarks.map(t => '  ' + t.toFixed(2) + ',').join('\n');
  const text = 'const LYRIC_START_TIMES = [\n' + lines + '\n];';
  navigator.clipboard.writeText(text).then(() => {
    syncCopyBtn.textContent = '✅ คัดลอกแล้ว!';
    setTimeout(() => { syncCopyBtn.textContent = '📋 คัดลอกอาเรย์'; }, 1500);
  }).catch(() => {
    alert(text);
  });
});

bgm.addEventListener('timeupdate', () => {
  if (syncMode){
    syncTimeEl.textContent = formatSyncTime(bgm.currentTime);
  }
});
</script>

</body>
</html>
